services:
  mother:
    # FW_VERSION rides into the build so the binary reports a real version
    # instead of the "dev" default. Unset means dev, which is the honest
    # answer for an image built from the working tree — see Dockerfile.mother.
    #   FW_VERSION=$(git describe --tags) docker compose up -d --build
    build:
      context: .
      dockerfile: Dockerfile.mother
      args: { VERSION: "${FW_VERSION:-dev}" }
    environment:
      FW_DB_PATH: /data/mother.db
      FW_LISTEN: ":8443"
      # Agents download their binaries from this address as well as pushing to
      # it — it is the only host they have. In this rig they resolve `mother`
      # on the compose network; on a real fleet it is the mother's LAN address.
      FW_PUBLIC_URL: "http://mother:8443"
      FW_API_KEY: dev-api-key
      # The catalogue lives on the volume, so builds survive a recreate:
      #   docker compose exec mother feast-watch build v1.5.0
      FW_BUILD_DIR: /data/builds
    restart: unless-stopped
    volumes: [ "mother-data:/data" ]
    ports: [ "8443:8443" ]
    # Also joined to the shared `feast-watch` network so the feast backend's
    # devcontainer can reach mother as http://mother:8443. The published port
    # is not usable from another container on macOS: host.docker.internal:8443
    # lands on whatever holds the host's 127.0.0.1:8443 (VS Code's port
    # forwarder), never on this container.
    networks: [ default, feast-watch ]

  agent-1:
    # Without this the self-update is a one-way door here. The agent's update
    # path ends in exit(0) and leaves the restart to the service manager —
    # Restart=always, RestartSec=5 in deploy/feast-watch-agent.service. A
    # container has no service manager, so an agent that took a rollout target
    # replaced its binary, exited cleanly and never came back: the row sat at
    # "pending" with no error, because an agent that is gone cannot report that
    # it is gone. `unless-stopped` rather than `always` so `docker compose stop`
    # still means stopped.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.agent
      args: { VERSION: "${FW_VERSION:-dev}" }
    depends_on: [ mother ]
    volumes: [ "./e2e/agent-1.conf:/etc/feast-watch/agent.conf:ro" ]

  agent-2:
    # Same as agent-1: self-update ends in exit(0) and needs something to
    # bring the process back.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.agent
      args: { VERSION: "${FW_VERSION:-dev}" }
    depends_on: [ mother ]
    volumes: [ "./e2e/agent-2.conf:/etc/feast-watch/agent.conf:ro" ]

volumes:
  mother-data:

networks:
  # Declared external (create once with `docker network create feast-watch`) so
  # `docker compose down` here leaves it in place — otherwise tearing mother
  # down would break the feast backend devcontainer, which declares the same
  # network and could not start without it.
  feast-watch:
    external: true
