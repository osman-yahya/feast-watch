name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        # gofmt -l prints the files that need formatting; any output is a failure.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: test
        run: go test -race -cover ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck committed scripts
        # mother/api/uninstall.sh is plain shell (not a template) precisely so
        # it can be linted here — it is the script an operator pipes into bash
        # on a production host.
        #
        # No --severity floor: every finding is either fixed or suppressed at
        # its line with a reason. A blanket floor would have hidden the next
        # real one, and this job's whole value is that it is believed.
        run: shellcheck bin/release.sh e2e/*.sh deploy/*.sh mother/api/uninstall.sh

  # The shell suites that need neither root, systemd, nor the network. They
  # were only ever run by hand, which is how a test rots: today's CI failure
  # was an eleven-run-old lint whose *next* step had silently never executed,
  # and an installer path nobody exercises is a worse version of that.
  #
  # e2e/local_smoke.sh is deliberately absent: it builds and runs a mother and
  # an agent, which belongs in a longer job than this one.
  shell-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: installer footprint, promote helper, download-and-verify
        run: |
          bash e2e/colocation_test.sh
          bash e2e/promote_test.sh
          bash e2e/download_test.sh

  # A separate job, not a second step of `shell`, and that separation is the
  # point. Steps carry an implicit `if: success()`, so while the lint above was
  # failing on info-level advisories this check was reported `skipped` on every
  # run it ever had — eleven of them. It is the more load-bearing of the two:
  # it is the only thing that verifies install.sh.tmpl renders to valid shell,
  # and that rendered script is piped into `sudo bash` on every monitored host.
  # A cosmetic advisory over there must never again decide whether it runs.
  install-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: shellcheck the rendered install script
        # install.sh.tmpl is a Go template, so it is not valid shell until
        # rendered. Render it with placeholder data, then lint the result — a
        # syntax error there is a broken install across the fleet, not a lint nit.
        run: |
          go run ./.github/tools/rendertmpl mother/api/install.sh.tmpl /tmp/install.sh
          bash -n /tmp/install.sh
          shellcheck /tmp/install.sh
